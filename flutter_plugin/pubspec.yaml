name: dcmtk_flutter
description: DCMTK (DICOM toolkit) Flutter plugin for iOS and Android
version: 1.0.0
homepage: https://github.com/zouqingsong/dcmtk

environment:
  sdk: '>=2.17.0 <4.0.0'
  flutter: ">=2.5.0"

flutter:
  plugin:
    platforms:
      android:
        package: com.dcmtk.flutter
        pluginClass: DcmtkFlutterPlugin
      ios:
        pluginClass: DcmtkFlutterPlugin
      macos:
        pluginClass: DcmtkFlutterPlugin

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0