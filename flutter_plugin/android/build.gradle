group 'com.dcmtk.flutter'
version '1.0-SNAPSHOT'

def dcmtkDictionarySource = file('../../dcmdata/data/dicom.dic')
def generatedDcmtkAssetsDir = "$buildDir/generated/dcmtk-assets"

buildscript {
    ext.kotlin_version = '2.1.0'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.3'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace 'com.dcmtk.flutter'
    
    // Use new compileSdk instead of compileSdkVersion
    if (project.android.hasProperty("namespace")) {
        compileSdk flutter.compileSdkVersion ?: 34
    } else {
        compileSdkVersion flutter.compileSdkVersion ?: 34
    }
    
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    defaultConfig {
        minSdkVersion flutter.minSdkVersion ?: 28
        ndk {
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                cppFlags '-std=c++14 -fexceptions'
                arguments '-DANDROID_STL=c++_shared'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
            assets.srcDirs += [generatedDcmtkAssetsDir]
        }
    }
}

tasks.register('copyDcmtkDictionary', Copy) {
    from(dcmtkDictionarySource)
    into("$generatedDcmtkAssetsDir/dcmtk")
}

afterEvaluate {
    tasks.matching { it.name.startsWith('merge') && it.name.endsWith('Assets') }.configureEach {
        dependsOn(tasks.named('copyDcmtkDictionary'))
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
}